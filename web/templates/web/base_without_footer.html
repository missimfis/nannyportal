{% load i18n %}
<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no"
    />
    <title>Nanny25</title>
    <meta
      name="description"
      content="Familien die für Ihre Kinder ein Nanny/Babysitter oder Tagesmutter benötigen haben bei uns die Möglichkeit ein Inserat zu erstellen und die passende Nanny/Babysitter oder Tagesmutter zu finden."
    />
    <meta name="author" content="Nanny25" />
    <meta
      name="keywords"
      lang="de"
      content="suche nanny, nanny gesucht, Babysitter, Nanny, Tagesmutter, Kinderbetreuung, Nannyjobs"
    />
    <meta
      name="keywords"
      lang="en"
      content="Nanny, Nannies, Jobs Nanny, Nannies Switzerland, Nanny Switzerland, Nanny Swiss, Childcare, Babysitter, Nanny, daycare, Nannyjobs"
    />
    <meta name="revisit-after" content="1 day" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0"
      crossorigin="anonymous"
    />
    {% load static %} <link href='{% static 'web/css/mainstyle.css' %}'
    rel='stylesheet' type='text/css'> {%block stylesheet%} {% endblock %}
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/media/web/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/media/web/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/media/web/favicons/favicon-16x16.png"
    />
    <link rel="manifest" href="/media/web/favicons/site.webmanifest" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3543124857947085"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-light fixed-top bg-light">
        <div class="container-fluid">
          <div class="titeltext">
            <img
              src="/media/web/images/newicon.png"
              alt="nanny25.ch"
            />Nanny25.ch
          </div>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            {% block messagenavbar %}{% endblock %}<span
              class="navbar-toggler-icon"
            ></span>
          </button>

          <div class="nav collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              {% block navigation %}{% endblock %}
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>{% block content %} {% endblock %}</main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-p34f1UUtsS3wqzfto5wAAmdvj+osOnFyQFpp4Ua3gs/ZVWx6oOypYoCJhGGScy+8"
      crossorigin="anonymous"
    ></script>
    {% block scripts %}{% endblock scripts %}
  </body>
</html>
